name: Build omake

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git

      - name: Checkout AUR package
        run: |
          git clone https://aur.archlinux.org/omake.git
          cd omake

      - name: Build package
        run: |
          cd omake
          makepkg -s --noconfirm

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: omake-package
          path: omake/*.pkg.tar.zst
          if-no-files-found: error
